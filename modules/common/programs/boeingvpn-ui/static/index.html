<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Boeing VPN</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="desktop">
      <div id="vpn-window" class="window">
        <div class="titlebar" id="titlebar">
          <span class="title">Boeing VPN</span>
        </div>
        <div class="body">
          <div class="status">
            <span id="status-dot" class="dot dot-grey"></span>
            <span id="status-label">Disconnected</span>
          </div>
          <div class="field">
            <label for="userid">User ID</label>
            <input
              id="userid"
              type="text"
              placeholder="userid"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label for="gateway">Gateway</label>
            <select id="gateway"></select>
          </div>
          <div class="buttons">
            <button id="btn-connect">Connect</button>
            <button id="btn-fastest">Connect fastest</button>
            <button id="btn-disconnect" disabled>Disconnect</button>
            <button id="btn-reconnect" disabled>Reconnect</button>
          </div>
          <div class="entry">
            <input
              id="secret"
              type="password"
              placeholder="PIN + token"
              autocomplete="off"
              spellcheck="false"
              disabled
            />
            <button id="btn-submit" disabled aria-label="Submit">&#9654;</button>
          </div>
          <div id="error-line" class="error-line"></div>
        </div>
      </div>

      <div id="bastion-window" class="window">
        <div class="titlebar" id="bastion-titlebar">
          <span class="title">Boeing Bastion (DB tunnels)</span>
        </div>
        <div class="body">
          <div class="status">
            <span id="b-status-dot" class="dot dot-grey"></span>
            <span id="b-status-label">Disconnected</span>
          </div>

          <div class="buttons">
            <button id="b-btn-connect">Connect</button>
            <button id="b-btn-disconnect" disabled>Disconnect</button>
          </div>

          <div id="b-login" class="login-box" hidden>
            <div class="login-title">Sign in to continue</div>
            <div class="login-row">
              Open <a id="b-login-url" href="#" target="_blank" rel="noreferrer">microsoft.com/device</a>
            </div>
            <div class="login-row">
              Code
              <span id="b-login-code" class="code-chip">--------</span>
              <button id="b-copy-code" class="mini-btn" type="button">Copy</button>
            </div>
            <div class="login-hint">Waiting for approval…</div>
          </div>

          <div class="creds" id="b-creds">
            <div class="cred-group">
              <div class="cred-head">Oracle</div>
              <div class="cred-row"><span>Local</span><code id="b-ora-local">—</code></div>
              <div class="cred-row"><span>User</span><code id="b-ora-user">—</code></div>
              <div class="cred-row"><span>Pass</span><code id="b-ora-pass" class="secret">—</code></div>
              <div class="cred-row"><span>URL</span><code id="b-ora-url">—</code></div>
            </div>
            <div class="cred-group">
              <div class="cred-head">Postgres</div>
              <div class="cred-row"><span>Local</span><code id="b-pg-local">—</code></div>
              <div class="cred-row"><span>User</span><code id="b-pg-user">—</code></div>
              <div class="cred-row"><span>Pass</span><code id="b-pg-pass" class="secret">—</code></div>
              <div class="cred-row"><span>URL</span><code id="b-pg-url">—</code></div>
            </div>
            <div class="cred-group">
              <div class="cred-head">Cosmos</div>
              <div class="cred-row"><span>Local</span><code id="b-cos-local">—</code></div>
              <div class="cred-row"><span>Key</span><code id="b-cos-key" class="secret">—</code></div>
              <div class="cred-row"><span>URL</span><code id="b-cos-url">—</code></div>
            </div>
          </div>

          <div id="b-error-line" class="error-line"></div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
